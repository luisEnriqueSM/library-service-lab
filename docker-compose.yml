services:
  library-mysql:
    image: mysql:8.4
    container_name: library-mysql
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - library_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "library_user", "-plibrary_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  library-service:
    image: library-service:local
    container_name: library-service
    depends_on:
      library-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://library-mysql:3306/library_db
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: library_password
    ports:
      - "8080:8080"

volumes:
  library_mysql_data: